name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0
      - name: Build and run all tests
        run: |
          chmod +x mvnw
          xvfb-run -a ./mvnw -B -ntp -Dchess.ui=true -Dprism.order=sw clean verify
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/ui-*.png
